[package]
name = "rdk-observer"
description = "System process observer for RDK devices"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
rbus = ["dep:rbus-core", "dep:rbus-provider", "tokio/signal"]
tui = [
    "dep:crossterm",
    "dep:futures",
    "dep:ratatui",
    "tokio/signal",
]

[dependencies]
rbus-core = { workspace = true, optional = true }
rbus-provider = { workspace = true, optional = true }
rdk-observer-core = { path = "../rdk-observer-core" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
futures = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true, features = ["event-stream"] }
