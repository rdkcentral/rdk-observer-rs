[workspace]
resolver = "3"
members = ["rdk-observer", "rdk-observer-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
rbus-core = { git = "https://github.com/rdkcentral/ieee1905-rs" }
rbus-provider = { git = "https://github.com/rdkcentral/ieee1905-rs"}
tokio = { version = "1.54.1", default-features = false }
tokio-util = "0.7.20"
neli = { version = "0.7.5", default-features = false }
rustix = "1.1.6"
procfs = "0.18.0"
clap = "4.6.7"
libc = "0.2.191"
rand = "0.10.3"
regex = "1.13.1"
futures = "0.3.34"
anyhow = "1"
hashlink = "0.12.2"
scopeguard = "1.2.0"
parking_lot = "0.13.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ratatui = "0.30"
crossterm = "0.29.0"

[profile.release]
strip = true
debug = false
opt-level = "z"
lto = true
codegen-units = 1
