name: Run Rust Coverage

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    # fork PRs get a read-only GITHUB_TOKEN regardless of the permissions above
    # skip the whole job is such case
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (+llvm-tools-preview)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run cargo llvm-cov
        run: cargo llvm-cov --workspace --summary-only --output-path coverage_report.txt

      - name: Formatting Coverage Report
        run: |
          echo '### Coverage Report' > coverage_report_formatted.txt
          echo '```text' >> coverage_report_formatted.txt
          cat coverage_report.txt >> coverage_report_formatted.txt
          echo -e '\n```' >> coverage_report_formatted.txt

      - name: Post Coverage Report Comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: coverage-report
          path: coverage_report_formatted.txt
