name: Run resources usage check

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  pull-requests: write

env:
  GLIBC_TARGET: x86_64-unknown-linux-gnu
  MUSL_TARGET: x86_64-unknown-linux-musl

jobs:
  resources-usage:
    runs-on: ubuntu-latest

    # fork PRs get a read-only GITHUB_TOKEN regardless of the permissions above
    # skip the whole job is such case
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ env.GLIBC_TARGET }},${{ env.MUSL_TARGET }}

      - name: Building
        run: cargo build --package rdk-observer --release --target $GLIBC_TARGET --target $MUSL_TARGET

      - name: Checking resources usage
        run: |
          set -euo pipefail
          
          ################################################################################
          # run the binary for 7s and take snapshot after 5s
          measure() {
            local bin=$1
            local mem_out=$2
            local cpu_out=$3
            local pid_file=$(mktemp)
            
            echo "Launching $bin"
            sudo timeout --kill-after=3s 7s bash -c "'$bin' & echo \$! > '$pid_file'; wait" &
          
            local runner=$!
            
            
            echo "Waiting for $bin to run for some time"
            sleep 5
            local pid=$(cat "$pid_file")
          
            echo "Measuring memory usage"
            sudo cat "/proc/$pid/status" > "$mem_out" || {
              echo "::error::$bin exited before the measurement was taken"
              exit 1
            }

            echo "Measuring cpu usage"
            sudo cat "/proc/$pid/stat" | sed 's/.*) //' \
              | awk -v tck="$(getconf CLK_TCK)" -v up="$(cut -d' ' -f1 /proc/uptime)" \
                  '{ printf "%.2f\n", ($12 + $13) / tck / (up - $20 / tck) * 100 }' > "$cpu_out"
          
            echo "Waiting for timeout to finish"
            wait $runner || true
          }
          
          ################################################################################
          # Print the value of a /proc/<pid>/status field in kB
          field() {
            awk -v key="$1:" '$1 == key { print $2 }' "$2"
          }
          
          ################################################################################
          # main
          GLIBC_BIN=./target/$GLIBC_TARGET/release/rdk-observer
          MUSL_BIN=./target/$MUSL_TARGET/release/rdk-observer

          measure $GLIBC_BIN glibc_status.txt glibc_cpu.txt
          measure $MUSL_BIN musl_status.txt musl_cpu.txt

          echo "Generating report"
          {
            echo "### Memory and CPU report after running for 5s"
            echo
            echo "OS: \`$(uname -srm)\`"
            echo
            echo "| Metric | glibc | musl | Δ (musl − glibc) |"
            echo "|---|--:|--:|--:|"
          
            for key in VmSize VmRSS VmHWM RssAnon RssFile; do
              g=$(field $key glibc_status.txt)
              m=$(field $key musl_status.txt)
              echo "| $key | $g kB | $m kB | $((m - g)) kB |"
            done
          
            echo "| | | | |"
            g=$(cat glibc_cpu.txt)
            m=$(cat musl_cpu.txt)
            echo "| CPU avg (% of one core) | $g % | $m % | $(awk -v g="$g" -v m="$m" 'BEGIN { printf "%+.2f", m - g }') % |"

            echo "| | | | |"
            g=$(( $(stat -c %s $GLIBC_BIN) / 1024 ))
            m=$(( $(stat -c %s $MUSL_BIN) / 1024 ))
            echo "| Binary size | $g kB | $m kB | $((m - g)) kB |"
          
          } > resources_usage_report.txt

          cat resources_usage_report.txt

      - name: Post resources usage report comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: resources-usage-report
          path: resources_usage_report.txt
